events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Allow large satellite image uploads (up to 500 MB)
    client_max_body_size 500M;

    # Upstream servers
    upstream backend {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP server (handles reverse proxy / tunnels directly and proxies to frontend/backend)
    server {
        listen 80;
        server_name _;

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # Frontend Next.js
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Allow large satellite image uploads
        client_max_body_size 500M;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ── Backend API (REST) ───────────────────────────────────────────────
        # NOTE: WebSocket upgrade headers are included here because the WS
        # endpoint lives under /api/v1/sessions/{id}/ws — i.e. under /api/.
        # Nginx will pass Upgrade/Connection through for WS connections and
        # ignore them harmlessly for regular HTTP requests.
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket upgrade support (for /api/v1/sessions/{id}/ws)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts: WS connections stay alive; large uploads may be slow
            proxy_read_timeout 86400s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 10s;
        }

        # ── Frontend (Next.js) ───────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # ── WebSocket connection header map ─────────────────────────────────────
    # Maps the Upgrade header to the correct Connection value.
    # Ensures non-WS requests get "close" and WS requests get "upgrade".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}