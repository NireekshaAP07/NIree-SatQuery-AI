# ⚠️  IMPORTANT — STORAGE NOTE:
# Satellite imagery, model weights, and derived products are managed via the
# storage abstraction (app/core/storage.py).
# For local dev without object storage: STORAGE_BACKEND=local uses ./data.
# For production / distributed deployments: STORAGE_BACKEND=s3 connects to
# MinIO (or AWS S3 / Cloudflare R2 / GCS) via http://minio:9000.

# ── DOCKER SECRETS ────────────────────────────────────────────────────────────
# Sensitive values are injected as in-memory files at /run/secrets/<name>.
# Fill the corresponding files in secrets/ before running in production.
# Local dev still works via .env fallback (see app/core/config.py).
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt

services:
  nginx:
    image: nginx:alpine
    container_name: satquery_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  migrate:
    build: .
    container_name: satquery_migrate
    command: alembic upgrade head
    env_file:
      - .env
    secrets:
      - postgres_password
      - secret_key
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: satquery_api
    expose:
      - "8000"
    env_file:
      - .env
    secrets:
      - postgres_password
      - secret_key
      - openai_api_key
      - gemini_api_key
      - minio_root_user
      - minio_root_password
    volumes:
      - satquery_data:/app/data      # Persistent dataset & output storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  worker:
    build: .
    container_name: satquery_worker
    command: python -m app.workers.query_worker
    env_file:
      - .env
    secrets:
      - postgres_password
      - secret_key
      - openai_api_key
      - gemini_api_key
      - minio_root_user
      - minio_root_password
    volumes:
      - satquery_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satquery_frontend
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  db:
    image: postgis/postgis:16-3.4   # PostgreSQL 16 with PostGIS 3.4
    container_name: satquery_db
    environment:
      POSTGRES_USER: satquery
      POSTGRES_DB: satquery_db
      # Password is injected via Docker secret — not hardcoded here.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - satquery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery -d satquery_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: satquery_redis
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - satquery_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: satquery_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - satquery_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: satquery_minio_init
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 $$(cat /run/secrets/minio_root_user | tr -d '\r\n') $$(cat /run/secrets/minio_root_password | tr -d '\r\n'); do
        echo 'Waiting for MinIO to become ready...';
        sleep 2;
      done;
      mc mb --ignore-existing myminio/satquery;
      mc anonymous set download myminio/satquery/derived;
      echo 'MinIO satquery bucket initialized.';
      exit 0;
      "
    secrets:
      - minio_root_user
      - minio_root_password
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  satquery_pgdata:
  satquery_data:
  satquery_redisdata:
  satquery_minio_data:
