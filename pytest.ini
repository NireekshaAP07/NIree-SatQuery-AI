[pytest]
asyncio_mode = auto
testpaths = tests

[pytest:env]
APP_ENV=development
STORAGE_BACKEND=local
STORAGE_LOCAL_ROOT=/tmp/satquery_test_storage
DATABASE_URL=postgresql+asyncpg://satquery:password@localhost:5432/satquery_db
REDIS_URL=redis://localhost:6379/0
GEMINI_API_KEY=
SECRET_KEY=test-secret-key-not-for-production
ALLOWED_ORIGINS=http://localhost:3000
